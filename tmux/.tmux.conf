set -g status-style "bg=default,fg=#cdd6f4"
set -g status-justify left
set -g status-left ""
set -g mouse on
set -g status-interval 2
set -g status-right-length 100
set -g window-status-separator ""

# tab name: "SSH: host" if any ssh runs in the pane's process tree, else the window name
%hidden NAME="#(~/.tmux/ssh-host.sh #{pane_pid} '#W')"

# inactive windows
set -g window-status-format "#[fg=#6c7086] \U000f08c7 #I ${NAME} "

# active window: rounded pill
set -g window-status-current-format "#[fg=#89b4fa]\ue0b6#[bg=#89b4fa,fg=#1e1e2e,bold]\U000f08c7 #I ${NAME} #[bg=default,fg=#89b4fa]\ue0b4 "

# right: folder icon + working directory
set -g status-right "#[fg=#313244]\ue0b6#[bg=#313244,fg=#f9e2af] \uf07b #[fg=#cdd6f4] #{s|$HOME|~|:pane_current_path} #[bg=default,fg=#313244]\ue0b4"
